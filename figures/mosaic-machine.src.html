<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mosaic, the machine</title>
<style>@media (max-width:560px){#stats{flex-wrap:wrap!important;row-gap:6px!important;column-gap:16px!important;justify-content:flex-start!important}}</style></head><body>
<script src="core.js"></script>
<script>
/* Mosaic, drawn as the machine it is: one real question from the live Cerebras run, end to end.

   THE QUESTION (q-a-128k-009, live, 2026-11): "What was the total amount refunded for billing issues in May?"
   Truth, computed in code from the labels: $1,788.61.

   HOW IT REALLY WORKS (each button is one real step; nothing moves off its path)
   1  Ask      the question card goes into the PLANNER. The planner is a model call (Qwen 3.8 27B, on the Cerebras
               cabinet, over the PLAN CALL cable) plus a JSON-schema validator in code. Out comes a plan card:
               filter months = [5]; map task = category + refund amount; reduce = sum of refund_amount where
               category = billing. The plan card rides the chute to the FILTER's reader.
   2  Filter   the LOG HOPPER holds the 128k log: 1,130 tickets. Code reads each ticket's header (date) against
               the plan: 186 are kept onto the belt, 944 drop into the REJECTS bin. No model is called.
   3  Send     the CHUNKER bands the 186 into bundles of about 3,000 tokens: 26, 26, 25, 27, 25, 25, 26 and 6.
               The ROUTER (turntable + quality gauge + token buckets) sends each bundle down the lane whose model
               is cheapest among those predicted to clear the 0.90 quality bar: Qwen on Cerebras every time
               (predicted 0.98-0.99; gpt-oss-120b 0.83-0.99 and dearer; the CPU model about 0.00). In the lane the
               model reads every ticket and stamps two facts on it (category, refund amount).
   4  Answer   the TALLY (code) adds refund amounts where category = billing: $1,788.61. Right.

   THE TWO BASELINES (same question, same day, same Cerebras model, real answers)
   P0f  filter in code, then ONE direct call over the 186 kept tickets: the model adds them up itself: $1,347.44.
   P0   no planner, no filter: the whole log goes to ONE direct call; only 949 of 1,130 tickets fit the
        131k-token context window, the rest are trimmed off: $1,244.74.

   PARTS (case / structure / mechanism / power / controls)
   board . planner tower (question slot, plan exit slot, screen, status light) . plan chute (feed belt, side rails)
   log hopper (clear acrylic, 1,130 ticket cards) . feed belt (legs, rollers) . filter housing (tunnel, reader slot,
   display) . reject chute . rejects bin . chunker arch (posts, band reel) . router turntable (deck, gate fence,
   rails to three lanes) . router tower (quality gauge, status light) . three lane belts . Cerebras cabinet (two
   tunnels, wafer badge, vents, context-window bar on the Qwen lane) . CPU box (tunnel, fan grille) . trimmed tray
   tally (three intake mouths, display, crank) . plan-call cable
   inside: planner: validator board + chip, plan card stock, print head, feed rollers, network port
           filter: header reader bar (red line), comb flaps, comb motor + shaft, reject chute
           router: predictor board, three token buckets (minute quota left), gate motor + drive shaft
           Cerebras: wafer on its cold plate (two model regions), coolant pipes + pump, power supply, two stamp
           heads with ribbon cables
           CPU: motherboard, CPU socket + heat sink + fan, two RAM sticks, stamp head
           tally: seven digit wheels on a shaft, drive gear, crank shaft, three intake rollers

   x = depth (front at x = 152), y = width (+y is viewer-left: the flow runs left to right on screen), z = up.
   Units about 1 cm. */

const BW = 152, BD = 262, BH = 3, BT = 11;                    // board, belt top
const LQ = 116, LG = 84, LU = 52;                             // lane centres: Qwen C5 (front), gpt-oss C4, CPU C6
const CX = 7, CY = 9;                                         // half size of a ticket card (x, y)
const N_LOG = 1130, N_KEEP = 186, N_FIT = 949;
const BUNDLES = [26, 26, 25, 27, 25, 25, 26, 6];
const Q5 = [.991, .977, .977, .983, .991, .991, .991, .991];   // predicted P(correct), current router model
const Q4 = [.841, .904, .916, .868, .853, .830, .850, .986];
const Q6 = [.001, .001, .001, .001, .001, .002, .001, .010];
const BAR = .90;
const RUNS = {
  P3:  { label:'P3  recursion, learned router', answer:1788.61, right:true,  calls:[1, 9], cost:['$0.0007', '$0.0120'] },
  P0f: { label:'P0f filter, then one call',     answer:1347.44, right:false, calls:[1, 2], cost:['$0.0007', '$0.0081'] },
  P0:  { label:'P0  one call, trimmed log',     answer:1244.74, right:false, calls:[0, 1], cost:['$0',      '$0.0370'] },
};
const TRUTH = 1788.61;
const CARD = { l:'#fbf6e6', m:'#ece3c8', d:'#c9bd99' }, STAMP = { l:'#dff3dd', m:'#c3e2c0', d:'#93b98f' };
const PLANC = { l:'#ffe58a', m:'#f4cf55', d:'#c49a2a' };
const BELT = { l:'#5a5550', m:'#47423d', d:'#2f2b28' }, CAB = { l:'#4a4744', m:'#393633', d:'#262321' };
const RECESS = '#221d1a', SCREEN = '#1d2a26', GLOW = '#8af0ae', LED_ON = '#43c25c', LED_OFF = '#5b5650', RED = '#e2483d';
const ORANGE = { l:'#f4a259', m:'#e08a3c', d:'#a95f22' };
// card stacks: height in proportion to the count, but a bundle stays thick enough to see (the 6-ticket one is thinner)
const stackH = n => n <= 0 ? 0 : Math.max(n < 10 ? 2.6 : 4.2, 1.2 + 30*n/N_LOG);
const money = v => '$' + v.toFixed(2).replace(/\B(?=(\d{3})+(?!\d))/g, ',');
const lerp = (a, b, t) => a + (b - a)*t, cl01 = t => Math.max(0, Math.min(1, t));
const seg = (t, a, b) => cl01((t - a)/(b - a));

/* ---------- small builders ---------- */
const it = (b, svg) => ({ box: b, svg });
const bxs = (x0, y0, z0, x1, y1, z1, m, shade = tone, w = 1) => box(x0, y0, z0, x1, y1, z1, m, shade, w);
const corners = (x0, y0, z0, x1, y1, z1) => { const o = []; for (const x of [x0, x1]) for (const y of [y0, y1]) for (const z of [z0, z1]) o.push([x, y, z]); return o; };
// a housing: its six faces, features drawn on whichever faces turn toward the viewer, a silhouette, and (see-through)
// the case as a ghost with the working parts over it
function housing(b, m, feats, mech, k, w = 2.4){
  const [[x0, y0, z0], [x1, y1, z1]] = b;
  let body = bxs(x0, y0, z0, x1, y1, z1, m, tone, 1.1);
  for (const ft of feats) if (facing(ft.n)) body += ft.svg();
  body += hullInk(corners(x0, y0, z0, x1, y1, z1), w);
  if (k <= 0) return body;
  const far = `<g opacity="${f(.45*k)}">` + [[0,1,0],[1,0,0],[0,-1,0],[-1,0,0],[0,0,1]].filter(n => !facing(n)).map(n => { const q = faceQuad(x0, y0, z0, x1, y1, z1, n); return fill(pd(q), mix(m.d, '#f2efe7', .55)); }).join('') + `</g>`;
  return far + `<g opacity="${f(1 - .8*k)}">${body}</g>` + `<g opacity="${f(k)}">${mech}</g>` + `<g opacity="${f(.55*k)}">${hullInk(corners(x0, y0, z0, x1, y1, z1), w)}</g>`;
}
function faceQuad(x0, y0, z0, x1, y1, z1, n){
  if (n[0] > 0) return [[x1,y0,z0],[x1,y1,z0],[x1,y1,z1],[x1,y0,z1]];
  if (n[0] < 0) return [[x0,y0,z0],[x0,y1,z0],[x0,y1,z1],[x0,y0,z1]];
  if (n[1] > 0) return [[x0,y1,z0],[x1,y1,z0],[x1,y1,z1],[x0,y1,z1]];
  if (n[1] < 0) return [[x0,y0,z0],[x1,y0,z0],[x1,y0,z1],[x0,y0,z1]];
  return [[x0,y0,z1],[x1,y0,z1],[x1,y1,z1],[x0,y1,z1]];
}
// a rectangle on a face: front/back faces (x = const) take (y0, y1, z0, z1); side faces (y = const) take (x0, x1, z0, z1)
const onX = (x, y0, y1, z0, z1) => [[x, y0, z0], [x, y1, z0], [x, y1, z1], [x, y0, z1]];
const onY = (y, x0, x1, z0, z1) => [[x0, y, z0], [x1, y, z0], [x1, y, z1], [x0, y, z1]];
const onZ = (z, x0, x1, y0, y1) => [[x0, y0, z], [x1, y0, z], [x1, y1, z], [x0, y1, z]];
const led = (x, y, z, lit, r = 1.4) => shape(on3(x, y, z, r), lit ? LED_ON : LED_OFF, .7)
  + (lit ? fill(pd(on3(x + .05, y, z, r*2.2)), LED_ON, 'opacity=".25"') : '');
const on3 = (x, y, z, r) => on(PX(x), ellUV(y, z, r, r, 12));
// text on a top face (z = const), reading along -y (left to right on screen at the default view)
const txZ = (x, y, z, str, size, col = INK, weight = 700) => { const o = P(x, y, z);
  return `<text transform="${txM(o, Dv(0,-1,0), Dv(-1,0,0))}" font-size="${size}" fill="${col}" text-anchor="middle" font-family="ui-monospace,Menlo,monospace" font-weight="${weight}" letter-spacing=".04em">${str}</text>`; };
// text on a face y = const seen from -y (the right side), reading along -x
const txYb = (x, y, z, str, size, col = INK, weight = 700) => { const o = P(x, y, z);
  return `<text transform="${txM(o, Dv(-1,0,0), Dv(0,0,-1))}" font-size="${size}" fill="${col}" text-anchor="middle" font-family="ui-monospace,Menlo,monospace" font-weight="${weight}" letter-spacing=".04em">${str}</text>`; };
// text on a back face (x = const) seen from behind, reading along +y
const txXb = (x, y, z, str, size, col = INK, weight = 700) => { const o = P(x, y, z);
  return `<text transform="${txM(o, Dv(0,1,0), Dv(0,0,-1))}" font-size="${size}" fill="${col}" text-anchor="middle" font-family="ui-monospace,Menlo,monospace" font-weight="${weight}" letter-spacing=".04em">${str}</text>`; };
const wire = (pts, col, w = .9) => { const d = pd(pts, false);
  return `<path d="${d}" fill="none" stroke="${INK}" stroke-width="${f(w*2 + .9)}" stroke-linejoin="round" stroke-linecap="round"/><path d="${d}" fill="none" stroke="${col}" stroke-width="${f(w*2)}" stroke-linejoin="round" stroke-linecap="round"/>`; };
const boxOf = (pts, pad = .8) => [[0,1,2].map(i => Math.min(...pts.map(p => p[i])) - pad), [0,1,2].map(i => Math.max(...pts.map(p => p[i])) + pad)];

/* ---------- ticket stacks: one box of cards, hairlines for the cards, a red band round a bundle ---------- */
function stackSvg(x0, y0, z0, x1, y1, h, col = CARD, band = false, bandY = null){
  if (h <= 0 || y1 - y0 <= .05) return '';
  const z1 = z0 + h;
  let s = bxs(x0, y0, z0, x1, y1, z1, col, toneI, .8);
  const n = Math.max(1, Math.min(14, Math.round(h / 1.6)));
  let hl = '';
  for (let i = 1; i < n; i++){ const z = z0 + h*i/n;
    if (facing([1,0,0])) hl += pd([[x1 + .05, y0, z], [x1 + .05, y1, z]], false);
    if (facing([-1,0,0])) hl += pd([[x0 - .05, y0, z], [x0 - .05, y1, z]], false);
    if (facing([0,1,0])) hl += pd([[x0, y1 + .05, z], [x1, y1 + .05, z]], false);
    if (facing([0,-1,0])) hl += pd([[x0, y0 - .05, z], [x1, y0 - .05, z]], false); }
  if (hl) s += `<path d="${hl}" fill="none" stroke="${col.d}" stroke-width=".5"/>`;
  if (facing([0,0,1]) && h > 1.5){ let ln = ''; for (let i = 0; i < 3; i++){ const x = x0 + 3 + i*3; ln += pd([[x, y0 + 2.5, z1 + .02], [x, y1 - (i === 2 ? 9 : 4), z1 + .02]], false); }
    s += `<path d="${ln}" fill="none" stroke="${col.d}" stroke-width=".55"/>`; }
  if (band && bandY != null && bandY > y0 && bandY < y1) s += bxs(x0 - .3, bandY - 1.1, z0 - .2, x1 + .3, bandY + 1.1, z1 + .25, matOf('#d8483a'), toneI, .5);
  return s;
}
// a stack moving along a lane: the parts outside housings are items; the parts inside a housing go to that housing
const TUNNELS = [ { name:'hopper', y0:226, y1:252 }, { name:'filter', y0:186, y1:214 }, { name:'cab', y0:66, y1:110 }, { name:'cpu', y0:72, y1:104 }, { name:'tally', y0:14, y1:46 } ];
function moveStack(items, inside, cx, yc, n, col, band, laneTunnels){
  const h = stackH(n), y0 = yc - CY, y1 = yc + CY, z0 = BT;
  let cuts = [[y0, y1, null]];
  for (const tn of TUNNELS.filter(t => laneTunnels.includes(t.name))){
    const nxt = [];
    for (const [a, b, w] of cuts){ if (w){ nxt.push([a, b, w]); continue; }
      const ia = Math.max(a, tn.y0), ib = Math.min(b, tn.y1);
      if (ia >= ib){ nxt.push([a, b, null]); continue; }
      if (a < ia) nxt.push([a, ia, null]); nxt.push([ia, ib, tn.name]); if (ib < b) nxt.push([ib, b, null]); }
    cuts = nxt; }
  for (const [a, b, w] of cuts){
    const svg = stackSvg(cx - CX, a, z0, cx + CX, b, h, col, band, yc);
    if (!svg) continue;
    if (w) (inside[w] = inside[w] || []).push(svg);
    else items.push(it([[cx - CX - .3, a, z0 - .2], [cx + CX + .3, b, z0 + h + .3]], svg));
  }
}

/* ---------- the state of the run at this instant ---------- */
function now(st){
  const mode = st.mode, run = st.run, p = run ? run.p : 0, T = run ? run.T : 0, tt = p*T;
  const o = { mode, hopper: N_LOG, kept: 0, rejects: 0, bundles: [], block: null, trim: null, slip: null, qcard: null, plan: null,
    disp: null, right: null, gauge: -1, lit: {}, done: st.done };
  const D = st.done;                                          // steps finished: 0 none, 1 asked, 2 filtered, 3 sent, 4 answered
  const act = run ? run.what : null;
  // question card
  const Q0 = [137, 235, BH + .3];
  if (D < 1 && act !== 'ask') o.qcard = { at: Q0, a: 0 };
  else if (act === 'ask'){
    if (mode === 'P0'){ const top = BT + stackH(N_LOG);
      const u = ease(seg(p, 0, 1)); o.qcard = { at: [lerp(Q0[0], LQ, u), lerp(Q0[1], 239, u), lerp(Q0[2], top + .2, u) + 18*Math.sin(Math.PI*u)], a: 0 }; }
    else { const u = ease(seg(p, 0, .5)), d = ease(seg(p, .5, .7));
      if (p < .7) o.qcard = { at: [lerp(Q0[0], 39, u), lerp(Q0[1], 237, u), lerp(Q0[2], 66, u) - 18*d + (p < .5 ? 10*Math.sin(Math.PI*u) : 0)], a: Math.min(1, u*1.3) };
      o.lit.planner = p > .55;
      const w = seg(p, .7, 1);
      if (w > 0) o.plan = planPos(ease(w)); } }
  else if (mode === 'P0' && D >= 1 && !(D >= 3)) o.qcard = { at: [LQ, 239, BT + stackH(N_LOG) + .2], a: 0, ride: true };
  if (mode !== 'P0' && (D >= 1 || (act === 'ask' && p >= 1))) o.plan = o.plan || planPos(1);
  // the log and the filter
  if (mode !== 'P0'){
    if (act === 'filter'){ const u = ease(p); o.hopper = Math.round(N_LOG*(1 - u)); o.kept = Math.round(N_KEEP*u); o.rejects = Math.round((N_LOG - N_KEEP)*u); o.lit.filter = true; }
    else if (D >= 2){ o.hopper = 0; o.kept = N_KEEP; o.rejects = N_LOG - N_KEEP; }
  }
  // sending
  if (mode === 'P3' && (act === 'send' || D >= 3)){
    let left = N_KEEP;
    BUNDLES.forEach((n, i) => { const d0 = .3 + i*.55, u = act === 'send' ? seg(tt, d0, d0 + 2.6) : 1;
      if (u <= 0) return; left -= n;
      const y = lerp(152, 30, u);
      o.bundles.push({ i, n, y, lane: LQ, stamped: y < 88 });
      if (y > 128 && y < 152) o.gauge = i;
      if (y < 110 && y > 66) o.lit.cabQ = true; });
    o.kept = act === 'send' ? left : 0;
    if (o.gauge < 0 && act === 'send') o.gauge = Math.min(BUNDLES.length - 1, Math.max(0, Math.floor((tt - .3)/.55)));
  }
  if (mode === 'P0f' && (act === 'send' || D >= 3)){
    const u = act === 'send' ? ease(seg(tt, 0, 2.2)) : 1;
    if (u < 1) o.block = { y: lerp(175, 88, u), n: N_KEEP };
    o.kept = 0; if (act === 'send' && tt > 1.2 && tt < 2.6) o.lit.cabQ = true;
    const sv = act === 'send' ? seg(tt, 2.4, 3.5) : 1; if (sv > 0 && sv < 1) o.slip = { y: lerp(66, 30, ease(sv)) };
    if (act === 'send') o.gauge = 99;
  }
  if (mode === 'P0' && (act === 'send' || D >= 3)){
    const a = act === 'send' ? ease(seg(tt, 0, 2.2)) : 1, b = act === 'send' ? ease(seg(tt, 2.9, 3.4)) : 1;
    o.hopper = 0;
    if (a < 1) o.block = { y: lerp(239, 112, a), n: N_LOG, q: true };
    else if (b < 1) o.block = { y: lerp(112, 88, b), n: N_FIT, q: true };
    const tr = act === 'send' ? ease(seg(tt, 2.2, 2.9)) : 1;
    if (a >= 1) o.trim = { u: tr };                           // the part above the window slides off to the tray
    if (act === 'send' && tt > 2.9 && tt < 3.6) o.lit.cabQ = true;
    const sv = act === 'send' ? seg(tt, 3.5, 4.5) : 1; if (sv > 0 && sv < 1) o.slip = { y: lerp(66, 30, ease(sv)) };
    if (act === 'send') o.gauge = 99;
  }
  // the answer
  const R = RUNS[mode];
  if (act === 'answer'){ o.lit.tally = true; o.disp = mode === 'P3' ? R.answer*ease(p) : (p > .3 ? R.answer : null); if (p >= 1) o.right = R.right; }
  else if (D >= 4){ o.disp = R.answer; o.right = R.right; }
  return o;
}
// the plan card's path: out of the planner's front slot, down the chute, into the filter's reader on top
function planPos(u){
  const a = [61, 236, 51], b = [104, 206, 49.4], c = [116, 200, 48.3];
  if (u < .8){ const w = u/.8; return { at: [lerp(a[0], b[0], w), lerp(a[1], b[1], w), lerp(a[2], b[2], w)] }; }
  const w = (u - .8)/.2; return { at: [lerp(b[0], c[0], w), lerp(b[1], c[1], w), lerp(b[2], c[2], w)] };
}

/* ---------- the scene ---------- */
function scene(st, m){
  const o = now(st), k = ease(st.xr || 0), items = [], inside = {}, lbls = [];
  let s = board(0, 0, BW, BD, BH, 6, BOARD);
  s += castShadow(corners(20, 222, BH, 58, 252, 56), BH, boardTop(0, 0, BW, BD, BH, 6))
    + castShadow(corners(70, 66, BH, 132, 110, 62), BH, boardTop(0, 0, BW, BD, BH, 6))
    + castShadow(corners(36, 14, BH, 134, 46, 40), BH, boardTop(0, 0, BW, BD, BH, 6))
    + castShadow(corners(103, 186, BH, 129, 214, 48), BH, boardTop(0, 0, BW, BD, BH, 6))
    + castShadow(corners(132, 134, BH, 146, 150, 36), BH, boardTop(0, 0, BW, BD, BH, 6))
    + castShadow(corners(40, 72, BH, 64, 104, 30), BH, boardTop(0, 0, BW, BD, BH, 6))
    + castShadow(corners(104, 226, BH, 128, 252, 48), BH, boardTop(0, 0, BW, BD, BH, 6));

  /* ---- belts: feed belt in pieces (so each sorts with what stands on it), three lanes, rails from the router ---- */
  const belt = (x0, x1, y0, y1, legs = true) => { let b = bxs(x0, y0, 7, x1, y1, BT, BELT, toneI, .9);
    if (facing([0,0,1])){ let r = ''; for (let y = y1 - 4; y > y0 + 1; y -= 6) r += pd([[x0 + .5, y, BT + .03], [x1 - .5, y, BT + .03]], false); b += `<path d="${r}" fill="none" stroke="#6d6761" stroke-width=".55"/>`; }
    let lg = ''; if (legs) for (const yy of [y0 + 2, y1 - 2]) for (const xx of [x0 + 2, x1 - 2]) lg += bxs(xx - 1, yy - 1, BH, xx + 1, yy + 1, 7, METAL, toneI, .6);
    return lg + b; };
  for (const [y0, y1] of [[228, 252], [214, 228], [166, 186], [152, 166]]) items.push(it([[LQ - 9, y0, BH], [LQ + 9, y1, BT]], belt(LQ - 9, LQ + 9, y0, y1)));
  for (const L of [LQ, LG, LU]){
    for (const [y0, y1] of L === LU ? [[104, 124], [46, 72]] : [[110, 124], [46, 66]]) items.push(it([[L - 9, y0, BH], [L + 9, y1, BT]], belt(L - 9, L + 9, y0, y1)));
  }
  // rails from the turntable to the two back lanes
  for (const L of [LG, LU]){ const a0 = [LQ - 9, 131], a1 = [LQ - 9, 140], b0 = [L - 9, 124], b1 = [L + 9, 124];
    const top = [[a0[0], a0[1], BT], [a1[0], a1[1], BT], [b1[0], b1[1] + 6, BT], [b1[0], b1[1], BT], [b0[0], b0[1], BT], [b0[0], b0[1] + 6, BT]];
    let r = shape(top, BELT.l, .9);
    const side = [[b0[0], b0[1], 7], [a0[0], a0[1], 7], [a0[0], a0[1], BT], [b0[0], b0[1], BT]];
    if (facing([0,-1,0])) r = shape(side, BELT.d, .8) + r;
    r += bxs(b0[0] + 1, 124.5, BH, b0[0] + 3, 126.5, 7, METAL, toneI, .6);
    items.push(it([[L - 9, 124, BH], [LQ - 9, 140, BT]], r)); }

  /* ---- moving things ---- */
  for (const bd of o.bundles){ if (bd.y < 34 && k <= 0) continue;
    moveStack(items, inside, bd.lane, bd.y, bd.n, bd.stamped ? STAMP : CARD, true, ['cab', 'tally']); }
  if (o.block){ moveStack(items, inside, LQ, o.block.y, o.block.n, CARD, false, o.mode === 'P0' ? ['hopper', 'filter', 'cab'] : ['cab']);

    let t = bxs(x0, y0, z0, x1, y1, z0 + 1, TR, toneI, .8);
    const nt = o.trim && o.trim.u >= 1 ? N_LOG - N_FIT : 0;
    if (nt) t += stackSvg(139 - CX, 121 - CY, z0 + 1, 139 + CX, 121 + CY, stackH(nt) - 1.2 + .3);
    for (const n of [[1,0,0],[-1,0,0],[0,1,0],[0,-1,0]]) if (facing(n)){ const q = faceQuad(x0, y0, z0, x1, y1, z1, n); t += shape(q, tone(n, TR), .8); }
    if (facing([1,0,0])) t += tx(x1 + .1, 121, 4.6, 'TRIMMED', 2.4, INK, 800);
    t += hullInk(corners(x0, y0, z0, x1, y1, z1), 1.4);
    items.push(it([[x0, y0, z0], [x1, y1, z1]], t));
    lbls.push({ at: [148, 121, 6], text: 'TRIMMED', on: !!nt, dx: 30, dy: 36 });
  }

  /* ---- tally (code): three intake mouths, display, crank ---- */
  {
    const b = [[36, 14, BH], [134, 46, 40]], lit = o.lit.tally;
    const dv = o.disp, rightTxt = o.right == null ? '' : o.right ? 'RIGHT' : 'WRONG';
    const feats = [
      { n:[1,0,0], svg: () => shape(onX(134.05, 17, 43, 19, 35), SCREEN, 1.2)
          + tx(134.1, 30, 30.5, dv == null ? '--' : money(dv), 4.6, GLOW, 800)
          + tx(134.1, 30, 23.2, rightTxt || (o.mode === 'P3' ? 'SUM WHERE BILLING' : 'ONE-CALL ANSWER'), 2.4, o.right == null ? GLOW : o.right ? GLOW : '#ff8a80', 800)
          + led(134.1, 40, 37.5, lit) + tx(134.1, 30, 10.5, 'TALLY (CODE)', 3.4, INK, 800) },
      { n:[0,1,0], svg: () => [LQ, LG, LU].map(L => shape(onY(46.05, L - 10, L + 10, 7, 26), RECESS, 1.1)).join('') + txY(85, 46.1, 33, 'TRUTH ' + money(TRUTH), 2.6, INK, 800) },
      { n:[0,-1,0], svg: () => shape(on(PY(13.95), ellUV(85, 24, 6, 6, 18)), METAL.m, 1) + txYb(85, 13.9, 34, 'MOSAIC', 3.4, INK, 800) },
    ];
    const ang = lit ? performance.now()/160 : 0;
    const crank = facing([0,-1,0]) ? rod([85, 14, 24], [85, 8, 24], 1.2, METAL) + rod([85, 8, 24], [85 + 7*Math.cos(ang), 8, 24 + 7*Math.sin(ang)], .9, METAL) + rod([85 + 7*Math.cos(ang), 8, 24 + 7*Math.sin(ang)], [85 + 7*Math.cos(ang), 4, 24 + 7*Math.sin(ang)], 1.3, DARK) : '';
    const mech = (() => { let q = rod([126, 44, 26], [126, 16, 26], .7, METAL, toneI, .5);
      for (let i = 0; i < 7; i++){ const y = 41 - i*3.6; q += rod([126, y + 1.2, 26], [126, y - 1.2, 26], 4.2, CERAMIC, toneI, .6); }
      q += rod([110, 30, 26], [110, 27, 26], 6, METAL, toneI, .6) + rod([85, 16, 24], [85, 30, 24], .8, METAL, toneI, .5);
      for (const L of [LQ, LG, LU]) q += rod([L - 8, 44, 13], [L + 8, 44, 13], 1.6, DARK, toneI, .5);
      q += (inside.tally || []).join('');
      return q; })();
    const hb = housing(b, m, feats, mech, k);
    items.push(it([[36, 4, BH], [134, 46, 40]], facing([0,-1,0]) ? hb + crank : crank + hb));
    lbls.push({ at: [134, 30, 22], text: 'TALLY (CODE)', on: lit, dx: 34, dy: 54 }, { at: [126, 30, 26], text: 'DIGIT WHEELS', on: lit, xr: true, dx: 34, dy: 50 });
  }

  /* ---- the plan-call cable: planner to the Cerebras cabinet, along the board ---- */
  {
    const pts = [[20, 236, 6.7], [14, 236, 3.6], [12, 230, 3.6], [12, 108, 3.6], [70, 108, 3.6]];
    for (let i = 0; i < pts.length - 1; i++) items.push(it(boxOf([pts[i], pts[i + 1]], .5), wire([pts[i], pts[i + 1]], '#3d3935', .8)));
    lbls.push({ at: [12, 226, 4], text: 'PLAN CALL TO QWEN', on: !!o.lit.planner, top: true });
  }

  s += sortItems(items);

  // labels: name tags on the surface; with see-through, the inside parts too
  // labels: the outside parts normally; in see-through, the working parts inside the cases
  s += placeLabels(lbls.filter(l => k > .6 ? l.xr : !l.xr));
  return s;
}
/* ---------- painter's order for many overlapping parts ----------
   byDepth runs one sort with a comparator that isn't transitive, so with ~40 parts on a board some pairs come out
   wrong. Here only pairs whose screen outlines overlap are ordered (by the engine's own box rule, sepOrder, or by
   depth when the boxes interpenetrate), then a topological sort draws them, nearest-last; a cycle is broken by depth. */
function sortItems(items){
  const its = items.filter(Boolean), n = its.length;
  const sb = its.map(t => { const q = corners(t.box[0][0], t.box[0][1], t.box[0][2], t.box[1][0], t.box[1][1], t.box[1][2]).map(p => P(...p));
    return [Math.min(...q.map(v => v[0])), Math.min(...q.map(v => v[1])), Math.max(...q.map(v => v[0])), Math.max(...q.map(v => v[1]))]; });
  const dep = its.map(t => depthOf(boxMid(t.box)));
  const after = Array.from({ length: n }, () => []), indeg = new Array(n).fill(0);
  for (let i = 0; i < n; i++) for (let j = i + 1; j < n; j++){
    const a = sb[i], b = sb[j];
    if (a[2] <= b[0] || b[2] <= a[0] || a[3] <= b[1] || b[3] <= a[1]) continue;      // no overlap on screen: no constraint
    let o = sepOrder(its[i], its[j]); if (!o) o = dep[i] < dep[j] ? -1 : 1;
    if (o < 0){ after[i].push(j); indeg[j]++; } else { after[j].push(i); indeg[i]++; } }
  const done = new Array(n).fill(false), out = [];
  for (let c = 0; c < n; c++){
    let pick = -1;
    for (let i = 0; i < n; i++) if (!done[i] && indeg[i] === 0 && (pick < 0 || dep[i] < dep[pick])) pick = i;
    if (pick < 0) for (let i = 0; i < n; i++) if (!done[i] && (pick < 0 || dep[i] < dep[pick])) pick = i;   // a cycle: farthest first
    done[pick] = true; out.push(its[pick].svg);
    for (const j of after[pick]) indeg[j]--; }
  return out.join('');
}
/* ---------- labels on two lines parallel to the board, one along its back edge and one along its front ----------
   Each label goes to the side of the machine its part is on, in the order its part sits along the board, so leaders
   never cross; along the slanted line, pills are spaced so their boxes can't overlap. Recomputed every frame, so it
   holds as the camera turns. Drawn with tag(), so on a phone they become numbered badges with a list underneath. */
function placeLabels(list){
  if (!list.length) return '';
  const k = INK_K, u = window.LBL_U ? LBL_U() : 0;
  const fs = u ? 10*u : 8.6*k, hgt = u ? 17*u : fs*1.8, gap = u ? 4*u : 5*k;
  const wOf = t => u ? hgt*1.3 : t.length*fs*.62 + fs*1.5;
  const A = P(BW/2, BD, BH), B = P(BW/2, 0, BH), c = [(A[0] + B[0])/2, (A[1] + B[1])/2];
  let d = [B[0] - A[0], B[1] - A[1]]; const dl = Math.hypot(...d) || 1; d = d.map(v => v/dl);
  if (d[0] < 0) d = d.map(v => -v);
  let n = [d[1], -d[0]]; if (n[1] > 0) n = n.map(v => -v);                 // the normal pointing up the screen
  const sil = corners(0, 0, 0, BW, BD, 62).map(p => P(...p)).map(q => [q[0] - c[0], q[1] - c[1]]);
  const reach = sgn => Math.max(...sil.map(q => sgn*(q[0]*n[0] + q[1]*n[1])));
  const L = list.map(l => { const [X, Y] = P(...l.at), rx = X - c[0], ry = Y - c[1];
    return { ...l, X, Y, w: wOf(l.text), t: rx*d[0] + ry*d[1], side: (rx*n[0] + ry*n[1]) >= 0 ? 1 : -1 }; });
  let out = '';
  for (const sgn of [1, -1]){
    const row = L.filter(l => l.side === sgn).sort((a, b) => a.t - b.t);
    const off = reach(sgn) + hgt*.9 + 8*k;
    // never left of the board's own left edge (the buttons sit there)
    const xL = Math.min(...corners(0, 0, BH, BW, BD, BH).map(p => P(...p)[0])) + 2*k;
    let prev = null;
    for (const l of row){
      if (d[0] > .05) l.t = Math.max(l.t, (xL + l.w/2 - c[0] - n[0]*sgn*off)/d[0]);
      if (prev){ const dtX = ((prev.w + l.w)/2 + gap) / Math.max(.05, Math.abs(d[0])), dtY = (hgt + gap) / Math.max(.05, Math.abs(d[1]));
        l.t = Math.max(l.t, prev.t + Math.min(dtX, dtY)); }
      prev = l; }
    for (const l of row){ const px = c[0] + d[0]*l.t + n[0]*sgn*off, py = c[1] + d[1]*l.t + n[1]*sgn*off;
      out += tag(l.at, (px - l.X)/k, (py - l.Y)/k, l.text, l.on); }
  }
  return out;
}
// the question card: lying flat (a = 0) or standing up in the y-z plane (a = 1) as it goes into the planner's slot
function qcardSvg(c, a, zmin = -1e9){
  const ang = a*Math.PI/2, hx = 6*Math.cos(ang), hz = 6*Math.sin(ang), hy = 8;
  const q = [[c[0] - hx, c[1] - hy, Math.max(zmin, c[2] - hz)], [c[0] - hx, c[1] + hy, Math.max(zmin, c[2] - hz)], [c[0] + hx, c[1] + hy, c[2] + hz], [c[0] + hx, c[1] - hy, c[2] + hz]];
  const n = norm(cross(sub(q[1], q[0]), sub(q[3], q[0]))), nn = facing(n) ? n : n.map(v => -v);
  let s = shape(q, toneI(nn, { l:'#ffffff', m:'#f3efe2', d:'#cfc8b4' }), .9);
  // printed lines: a heading and three rows
  const at = (u, v) => [c[0] + (u*hx), c[1] + v*hy, c[2] + u*hz];
  let ln = pd([at(-.55, .75), at(-.55, -.2)], false); for (const u of [-.15, .2, .55]) ln += pd([at(u, .75), at(u, -.75)], false);
  s += `<path d="${ln}" fill="none" stroke="#7d7466" stroke-width=".7"/>`;
  if (a < .2 && facing([0,0,1])) s += txZ(c[0] - 4.2, c[1] - 4.8, c[2] + .05, 'Q', 3, RED, 800);
  return s;
}
function plainCard(x, y, z, col, lines = false){
  const q = onZ(z, x - 5.5, x + 5.5, y - 7, y + 7);
  let s = shape(q, col.l, .8);
  if (lines){ let ln = ''; for (const u of [-2.5, 0, 2.5]) ln += pd([[x + u, y + 5, z + .05], [x + u, y - 5, z + .05]], false); s += `<path d="${ln}" fill="none" stroke="${col.d}" stroke-width=".6"/>`; }
  return s;
}

/* ---------- behaviour ---------- */
let ui;
const ORDER = ['ask', 'filter', 'send', 'answer'];
const DUR = { ask: 1.8, filter: 2.2, send: { P3: 6.8, P0f: 3.8, P0: 4.8 }, answer: 1.8 };
function start(st, what){
  if (st.run) return ui.flash('One step at a time: this one is still running');
  const need = ORDER.indexOf(what);
  if (st.done >= 4 && what === 'ask'){ reset(st); }
  else if (st.done > need) return ui.flash(what === 'ask' ? 'Already asked: pick a pipeline to start over' : 'Done already: press the next step');
  if (what === 'filter' && st.mode === 'P0'){ if (st.done < 1) return ui.flash('Ask the question first'); st.done = Math.max(st.done, 2); return ui.flash('P0 has no filter: the whole log goes to one call'); }
  if (st.done < need){ return ui.flash(['', 'Ask the question first', st.mode === 'P0' ? 'Ask the question first' : 'Filter the log first', 'Send it to the model first'][need]); }
  const T = what === 'send' ? DUR.send[st.mode] : DUR[what];
  st.run = { what, p: 0, T };
  ui.animate(dt => { const r = st.run; if (!r) return false; r.p = Math.min(1, r.p + dt / r.T);
    if (r.p >= 1){ st.run = null; st.done = need + 1; return false; } return true; });
}
function reset(st){ st.run = null; st.done = 0; }
// calls and spend count up as they happen: P3's eight map calls as each bundle passes its stamp head (live costs per
// call), a baseline's one direct call as its block enters the lane
const MAP_COST = [.00155, .00154, .00152, .00157, .00151, .00154, .00155, .00048];
function costNow(st){ const R = RUNS[st.mode], o = now(st), sending = st.run && st.run.what === 'send';
  if (st.done >= 3) return { calls: R.calls[1], cost: R.cost[1] };
  if (sending && st.mode === 'P3'){ const n = o.bundles.filter(b => b.stamped).length;
    return { calls: 1 + n, cost: '$' + (.0007 + MAP_COST.slice(0, n).reduce((a, b) => a + b, 0)).toFixed(4) }; }
  if (sending && o.lit.cabQ) return { calls: R.calls[1], cost: R.cost[1] };
  return st.done >= 1 ? { calls: R.calls[0], cost: R.cost[0] } : { calls: 0, cost: '$0' }; }

ui = mountFigure({
  fig:'M', title:'Mosaic, the machine', credit:true, turn:'full',
  size:[BW, BD, 62], palette:'cobalt',
  state:{ mode:'P3', done:0, run:null },
  scene,
  buttons:[
    { label:'Pipeline', choices: st => Object.entries(RUNS).map(([key, r]) => ({ label: r.label, current: st.mode === key && st.done === 0,
        onClick: st => { st.mode = key; reset(st); } })) },
    { label:'Ask the question', onClick: st => start(st, 'ask') },
    { label:'Filter in code', onClick: st => start(st, 'filter') },
    { label:'Send to the model', onClick: st => start(st, 'send') },
    { label:'Read the answer', onClick: st => start(st, 'answer') },
  ],
  stats: st => { const o = now(st), c = costNow(st);
    return [{ label: o.right == null ? 'Answer' : o.right ? 'Answer: right' : 'Answer: wrong', value: o.disp == null ? '--' : money(o.disp), small:true },
      { label:'Truth', value: money(TRUTH), small:true }, { label:'Model calls', value: String(c.calls), small:true }, { label:'Cost', value: c.cost, small:true }]; },
  acts:{ ask: st => start(st, 'ask') },
  params:(st, q) => { if (RUNS[q.get('mode')]) st.mode = q.get('mode'); if (q.has('done')) st.done = Math.max(0, Math.min(4, +q.get('done')));
    if (q.has('step')){ const [w, p] = q.get('step').split(':'); if (ORDER.includes(w)){ st.done = ORDER.indexOf(w); st.run = { what: w, p: +p || .5, T: w === 'send' ? DUR.send[st.mode] : DUR[w], frozen: true }; } } },
});
xrMount(() => ui, () => '');
</script></body></html>
