[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mosaic"
version = "0.1.0"
description = "Heterogeneous recursion router: plan, filter in code, fan out routed model calls, reduce in code, and prove non-inferiority."
requires-python = ">=3.11"
dependencies = ["httpx>=0.27", "pydantic>=2.6", "numpy>=1.26", "scipy>=1.11", "scikit-learn>=1.4",
                "matplotlib>=3.8", "pandas>=2.1", "pyarrow>=14", "pyyaml>=6"]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "pytest-asyncio>=0.23"]
local = ["llama-cpp-python[server]>=0.3"]

[project.scripts]
mosaic = "mosaic.cli:main"

[tool.setuptools.packages.find]
include = ["mosaic*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = ["live: calls real provider APIs (opt-in: pytest -m live)"]
addopts = "-m 'not live'"

[tool.coverage.run]
source = ["mosaic"]
omit = ["mosaic/cli.py", "mosaic/report/demo.py"]
