# Candidate pool (PRD 7). One row per (model, device) pair the router can send a call to.
# Limits live here, not in code. `mosaic candidates` refreshes model IDs and windows from the
# providers' /models endpoints and warns when rate-limit headers disagree with this file.
#
# Prices are $ per million tokens, entered by hand from public price lists as of Nov 2026 and
# used only for comparison; free-tier calls are priced at list price (PRD 11). Qwen 3.8 27B on
# Cerebras has no public list price we could confirm: its price is a placeholder.
#
# Latency priors (ttft_ms, prefill_tps, tps_out) are used before profiling exists. Groq and
# local-CPU priors are overwritten by measured profiles; Cerebras priors are vendor-claim-level
# guesses because Cerebras was not reachable from the build machine.
#
# `sim:` holds the simulator's error model for each weight family (see mosaic/providers/sim.py).
# `mosaic calibrate` fits per-field error rates (err_category, err_refund, err_sentiment), drop and
